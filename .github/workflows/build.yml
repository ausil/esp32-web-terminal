name: Build

on:
  push:
    branches: [main]
    tags: ['v*', '!v*-factory']
  pull_request:
    branches: [main]

jobs:
  # Fast gate: host-compiled unit tests (see tests/host/Makefile) + the
  # factory_flash.py suite. No ESP-IDF, no hardware — this runs before and
  # independently of the three-target firmware matrix, and release waits for
  # both.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The C suites use OpenSSL EVP as an independent SHA-256 oracle.
      # libssl-dev is preinstalled on ubuntu-latest; this is a cheap no-op
      # there and a rescue if the image ever changes.
      - name: Ensure libssl-dev
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Host unit tests
        run: make -C tests/host test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: factory_flash.py tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/tools -v

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: esp32c6
            flash_size: 8MB
          - target: esp32c3
            flash_size: 4MB
          - target: esp32s3
            flash_size: 8MB
    steps:
      - uses: actions/checkout@v6

      - name: Generate TLS certificates
        run: cd certs && ./generate_cert.sh && cd ..

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: ${{ matrix.target }}
          command: idf.py build merge-bin -o factory.bin

      - name: Rename artifacts
        run: |
          cp build/esp32-web-terminal.bin esp32-web-terminal-${{ matrix.target }}.bin
          cp build/factory.bin esp32-web-terminal-${{ matrix.target }}-factory.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.target }}
          path: |
            esp32-web-terminal-${{ matrix.target }}.bin
            esp32-web-terminal-${{ matrix.target }}-factory.bin

  release:
    needs: [build, host-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true

      # Keep the main release at 3 assets (app bins only) and publish factory
      # images as a companion prerelease, which releases/latest excludes.
      # This no longer protects firmware ≤1.4.2, which reads releases/latest
      # into an 8KB buffer: GitHub adds a per-asset digest field, so the
      # response has measured ~8.2KB since v1.5.1 and those devices cannot
      # check for updates at any asset count. See CLAUDE.md.
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            esp32-web-terminal-esp32c3.bin
            esp32-web-terminal-esp32c6.bin
            esp32-web-terminal-esp32s3.bin
          generate_release_notes: true

      - name: Create factory images release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}-factory
          name: Factory images ${{ github.ref_name }}
          prerelease: true
          files: '*-factory.bin'
          body: >
            Merged factory images (bootloader + partition table + firmware,
            flash at 0x0) for ${{ github.ref_name }}. Use tools/factory_flash.py,
            or esptool directly. For OTA updates use the
            ${{ github.ref_name }} release instead.
